name: CI

on:
  pull_request:

jobs:
  biometrics:
    name: Biometrics (Python ${{ matrix.python-version }}, cbor2 ${{ matrix.cbor-version }})
    # Pinned: Python 3.9, which older Pods run, is not offered on the newest runner image
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - python-version: '3.9'
            cbor-version: '5.6.5'
          - python-version: '3.10'
            cbor-version: '5.8.0'
          - python-version: '3.10'
            cbor-version: '6.1.5'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install biometrics dependencies
        run: python -m pip install -r biometrics/requirements.txt "cbor2==${{ matrix.cbor-version }}"
      - name: Test biometrics
        run: python -m unittest discover -s biometrics/tests -v
      - name: Test maintenance and dependency installation
        run: python -m unittest discover -s scripts/tests -v

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            ./app/package-lock.json
            ./server/package-lock.json

      - name: Install dependencies (app)
        working-directory: app
        run: npm ci

      - name: Install dependencies (server)
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npm run generate

      - name: Build (server)
        working-directory: server
        run: npm run build:pr

      - name: Build (app)
        working-directory: app
        run: npm run build:pr

      - name: Require clean working directory
        run: |
          # Source maps are left out: they differ between machines while the code they map is identical
          if ! git diff --exit-code --stat -- . ':(exclude)server/public/*.map' ':(exclude)server/dist/**/*.map'; then
            echo "The committed build output is out of date. Run 'npm run build:pr' in server/ and app/ and commit the result."
            exit 1
          fi

  tests:
    name: Tests (schedules, alarms, in-bed detection)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            ./app/package-lock.json
            ./server/package-lock.json

      # The tests import TypeScript sources from both packages and moment from the server's
      - name: Install dependencies (server)
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Install dependencies (app)
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Run tests
        run: node --test tests/*.test.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package-name:
          - app
          - server

    defaults:
      run:
        working-directory: ${{ matrix.package-name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ./${{ matrix.package-name }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
