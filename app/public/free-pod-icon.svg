<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="306" cy="186" r="112" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#night)"/>
  <!-- A crescent moon over the bed's surface -->
  <circle cx="246" cy="222" r="128" fill="#8ea2ff" mask="url(#crescent)"/>
  <rect x="116" y="388" width="280" height="28" rx="14" fill="#8ea2ff" opacity="0.45"/>
</svg>
