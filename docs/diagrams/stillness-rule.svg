<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 378" width="680" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Asleep or awake, by stillness</title><desc>Each minute's moving seconds are counted. Awake: the last 15 minutes still with at most one turn means asleep. Asleep: three restless minutes of the last five means awake.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="378" rx="12" fill="#ffffff"/><rect x="190" y="30" width="300" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="340.0" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Count the minute's moving seconds</text><text x="340.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Still 0-3, turn 4-11, restless 12+</text><path d="M340 86 L340 104 L190 104 L190 122" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M340 86 L340 104 L490 104 L490 122" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="126" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="190.0" y="144" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">If you were awake</text><text x="190.0" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">The last 15 minutes are read</text><rect x="360" y="126" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="490.0" y="144" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">If you were asleep</text><text x="490.0" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">The last 5 minutes are read</text><path d="M190 182 L190 210" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M490 182 L490 210" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="60" y="214" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="190.0" y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Still, with one turn at most?</text><text x="190.0" y="252" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">And still at both ends</text><rect x="360" y="214" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="490.0" y="232" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Three of them restless?</text><text x="490.0" y="252" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">One or two turns do not count</text><path d="M190 270 L190 298" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="200" y="289" text-anchor="start" font-size="12" fill="#4b5563">yes</text><path d="M490 270 L490 298" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="500" y="289" text-anchor="start" font-size="12" fill="#4b5563">yes</text><rect x="60" y="302" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="190.0" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Asleep</text><text x="190.0" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">A night counts from its first still minute</text><rect x="360" y="302" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="490.0" y="320" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Awake</text><text x="490.0" y="340" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">The 15 minutes start over</text></svg>
