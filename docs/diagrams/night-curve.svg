<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 372" width="680" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>What the autopilot aims for through a night</title><desc>Degrees from the base temperature against hours asleep: at the base on falling asleep, 2°F cooler from a tenth of the night to half way, 3°F cooler during the first sleep cycle, back at the base by 85% of the night and 1°F warm at wake time. Never more than 4°F from the base.</desc><rect x="0" y="0" width="680" height="372" rx="12" fill="#ffffff"/><line x1="64" y1="286.0" x2="644" y2="286.0" stroke="#e5e7eb" stroke-width="1"/><text x="54" y="290.0" text-anchor="end" font-size="11.5" fill="#4b5563">−4°F</text><line x1="64" y1="244.0" x2="644" y2="244.0" stroke="#e5e7eb" stroke-width="1"/><text x="54" y="248.0" text-anchor="end" font-size="11.5" fill="#4b5563">−3°F</text><line x1="64" y1="202.0" x2="644" y2="202.0" stroke="#e5e7eb" stroke-width="1"/><text x="54" y="206.0" text-anchor="end" font-size="11.5" fill="#4b5563">−2°F</text><line x1="64" y1="160.0" x2="644" y2="160.0" stroke="#e5e7eb" stroke-width="1"/><text x="54" y="164.0" text-anchor="end" font-size="11.5" fill="#4b5563">−1°F</text><line x1="64" y1="118.0" x2="644" y2="118.0" stroke="#9ca3af" stroke-width="1"/><text x="54" y="122.0" text-anchor="end" font-size="11.5" font-weight="600" fill="#111827">Base</text><line x1="64" y1="76.0" x2="644" y2="76.0" stroke="#e5e7eb" stroke-width="1"/><text x="54" y="80.0" text-anchor="end" font-size="11.5" fill="#4b5563">+1°F</text><line x1="64" y1="34.0" x2="644" y2="34.0" stroke="#e5e7eb" stroke-width="1"/><text x="54" y="38.0" text-anchor="end" font-size="11.5" fill="#4b5563">+2°F</text><line x1="64" y1="286.0" x2="644" y2="286.0" stroke="#4b5563" stroke-width="1" stroke-dasharray="5 4"/><text x="644" y="279.0" text-anchor="end" font-size="11.5" fill="#4b5563">Limit: never more than 4°F from the base, either way</text><line x1="64.0" y1="286" x2="64.0" y2="291" stroke="#9ca3af" stroke-width="1"/><text x="64.0" y="306" text-anchor="start" font-size="11.5" fill="#4b5563">Asleep</text><line x1="209.0" y1="286" x2="209.0" y2="291" stroke="#9ca3af" stroke-width="1"/><text x="209.0" y="306" text-anchor="middle" font-size="11.5" fill="#4b5563">2 h</text><line x1="354.0" y1="286" x2="354.0" y2="291" stroke="#9ca3af" stroke-width="1"/><text x="354.0" y="306" text-anchor="middle" font-size="11.5" fill="#4b5563">4 h</text><line x1="499.0" y1="286" x2="499.0" y2="291" stroke="#9ca3af" stroke-width="1"/><text x="499.0" y="306" text-anchor="middle" font-size="11.5" fill="#4b5563">6 h</text><line x1="644.0" y1="286" x2="644.0" y2="291" stroke="#9ca3af" stroke-width="1"/><text x="644.0" y="306" text-anchor="end" font-size="11.5" fill="#4b5563">Wake time</text><text x="354.0" y="330" text-anchor="middle" font-size="11.5" fill="#4b5563">A night of 8 hours. A shorter or longer one stretches the same shape between asleep and wake time.</text><text x="354.0" y="348" text-anchor="middle" font-size="11.5" fill="#4b5563">The bed follows in whole degrees, one step every 10 minutes at most.</text><path d="M64 118.0 L88.2 153.0 L88.2 195.0 L122.0 244.0 L172.8 244.0 L172.8 202.0 L354.0 202.0 L557.0 118.0 L644 76.0" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="64" cy="118.0" r="4.5" fill="#111827" stroke="#ffffff" stroke-width="2"/><circle cx="354.0" cy="202.0" r="4.5" fill="#111827" stroke="#ffffff" stroke-width="2"/><circle cx="557.0" cy="118.0" r="4.5" fill="#111827" stroke="#ffffff" stroke-width="2"/><circle cx="644" cy="76.0" r="4.5" fill="#111827" stroke="#ffffff" stroke-width="2"/><circle cx="147.9" cy="244.0" r="4.5" fill="#111827" stroke="#ffffff" stroke-width="2"/><text x="74" y="108.0" text-anchor="start" font-size="12" font-weight="600" fill="#111827">Falls asleep at the base</text><text x="147.9" y="264.0" text-anchor="start" font-size="12" font-weight="600" fill="#111827">First sleep cycle: 1°F cooler still</text><text x="147.9" y="279.0" text-anchor="start" font-size="11.5" fill="#4b5563">(minutes 20 to 90 of sleep)</text><text x="346.0" y="190.0" text-anchor="end" font-size="12" font-weight="600" fill="#111827">2°F cooler through the first half</text><text x="567.0" y="138.0" text-anchor="start" font-size="12" font-weight="600" fill="#111827">Back at the base</text><text x="634" y="66.0" text-anchor="end" font-size="12" font-weight="600" fill="#111827">1°F warm at wake time</text></svg>
