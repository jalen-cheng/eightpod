<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 536" width="680" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Tuning the sleep rules</title><desc>Each night's record, from a tracker or set by hand, is filed with the matching stay. From seven nights, 216 rule sets are replayed and the best is taken up only if it also does better on a night left out of the fit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="536" rx="12" fill="#ffffff"/><rect x="150" y="30" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="280.0" y="48" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">A night's record arrives</text><text x="280.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">From a tracker, or set by hand</text><path d="M280 86 L280 112" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="150" y="116" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="280.0" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Filed with the matching stay</text><text x="280.0" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Minute by minute, side by side</text><path d="M280 172 L280 198" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="150" y="202" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="280.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Seven nights with both?</text><text x="280.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Naps are not counted</text><path d="M410 230 L466 230" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="438" y="220" text-anchor="middle" font-size="12" fill="#4b5563">no</text><rect x="470" y="202" width="170" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="555.0" y="220" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Defaults stay</text><text x="555.0" y="240" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Match is only shown</text><path d="M280 258 L280 284" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="290" y="275" text-anchor="start" font-size="12" fill="#4b5563">yes</text><rect x="150" y="288" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="280.0" y="306" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">216 rule sets are replayed</text><text x="280.0" y="326" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Scored on minutes that disagree</text><path d="M280 344 L280 370" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="150" y="374" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="280.0" y="392" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Better on a night left out?</text><text x="280.0" y="412" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">By a tenth or more</text><path d="M410 402 L466 402" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="438" y="392" text-anchor="middle" font-size="12" fill="#4b5563">no</text><rect x="470" y="374" width="170" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="555.0" y="392" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Defaults stay</text><text x="555.0" y="412" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Fit was not trusted</text><path d="M280 430 L280 456" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="290" y="447" text-anchor="start" font-size="12" fill="#4b5563">yes</text><rect x="150" y="460" width="260" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="280.0" y="478" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Fitted rules take over</text><text x="280.0" y="498" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Still minutes, restless seconds</text></svg>
