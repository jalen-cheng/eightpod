<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Is a person in bed</title><desc>Once a minute for each side: the capacitive sensors say whether anything is on the side, then the piezo sensor says whether it is a body. Only a body goes on to the sleep rules.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="370" rx="12" fill="#ffffff"/><rect x="170" y="30" width="240" height="44" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="290.0" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Once a minute, each side</text><path d="M290 74 L290 102" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="170" y="106" width="240" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="290.0" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Anything on this side?</text><text x="290.0" y="144" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Capacitive sensors</text><path d="M410 134 L466 134" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="438" y="124" text-anchor="middle" font-size="12" fill="#4b5563">no</text><rect x="470" y="106" width="170" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="555.0" y="124" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Empty</text><text x="555.0" y="144" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Nothing to follow</text><path d="M290 162 L290 196" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="300" y="183" text-anchor="start" font-size="12" fill="#4b5563">yes</text><rect x="170" y="200" width="240" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="290.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">Is it a body?</text><text x="290.0" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Piezo at 5x the empty bed</text><path d="M410 228 L466 228" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="438" y="218" text-anchor="middle" font-size="12" fill="#4b5563">no</text><rect x="470" y="200" width="170" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="555.0" y="218" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">A thing, not you</text><text x="555.0" y="238" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">No stay, no sleep</text><path d="M290 256 L290 290" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/><text x="300" y="277" text-anchor="start" font-size="12" fill="#4b5563">yes</text><rect x="170" y="294" width="240" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/><text x="290.0" y="312" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#111827">A person is in bed</text><text x="290.0" y="332" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4b5563">Stillness decides the rest</text></svg>
