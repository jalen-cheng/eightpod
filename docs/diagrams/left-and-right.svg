<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 884" width="824" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Left and right: where a side is chosen, copied and swapped</title><desc>Each device picks a side or both. Linked sides have changes copied by the app or the server. Some state is per side and some for the whole bed. The flip swaps sides only at the firmware.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="824" height="884" rx="12" fill="#ffffff"/><rect x="12" y="12" width="800" height="104" rx="10" fill="#f8f9fb" stroke="#d7dae0" stroke-width="1"/><text x="26" y="34" font-size="13" font-weight="700" fill="#111827" letter-spacing="0.2">On each phone or computer</text><rect x="12" y="130" width="800" height="180" rx="10" fill="#f8f9fb" stroke="#d7dae0" stroke-width="1"/><text x="26" y="152" font-size="13" font-weight="700" fill="#111827" letter-spacing="0.2">Sides linked (Both): who copies a change to the other side</text><rect x="12" y="324" width="800" height="164" rx="10" fill="#f8f9fb" stroke="#d7dae0" stroke-width="1"/><text x="26" y="346" font-size="13" font-weight="700" fill="#111827" letter-spacing="0.2">Kept per side, or for the whole bed</text><rect x="12" y="502" width="800" height="164" rx="10" fill="#f8f9fb" stroke="#d7dae0" stroke-width="1"/><text x="26" y="524" font-size="13" font-weight="700" fill="#111827" letter-spacing="0.2">Flip left and right: swapped only where the server meets the firmware</text><rect x="12" y="680" width="800" height="192" rx="10" fill="#f8f9fb" stroke="#d7dae0" stroke-width="1"/><text x="26" y="702" font-size="13" font-weight="700" fill="#111827" letter-spacing="0.2">The bed</text><rect x="30" y="46" width="764" height="52" rx="7" fill="#eef0f4" stroke="#6b7280" stroke-width="1"/><text x="412.0" y="64" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#111827">This device controls: Left, Right or Both</text><text x="412.0" y="82" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Left or Right is remembered on that device only. Both links the sides, for everyone.</text><rect x="30" y="164" width="244" height="100" rx="7" fill="#eef0f4" stroke="#6b7280" stroke-width="1"/><text x="152.0" y="182" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#111827">The app copies</text><text x="152.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Power and temperature</text><text x="152.0" y="216" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Saving a schedule</text><text x="152.0" y="232" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Skipping or setting an alarm</text><text x="152.0" y="248" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Alarm settings (always both)</text><rect x="290" y="164" width="244" height="100" rx="7" fill="#eef0f4" stroke="#6b7280" stroke-width="1"/><text x="412.0" y="182" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#111827">The server copies</text><text x="412.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Shortcuts: dial, alarm time</text><text x="412.0" y="216" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Buttons and taps</text><text x="412.0" y="232" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">In-bed actions (one stay)</text><text x="412.0" y="248" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">The autopilot (always both)</text><rect x="550" y="164" width="244" height="100" rx="7" fill="#eef0f4" stroke="#6b7280" stroke-width="1"/><text x="672.0" y="182" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#111827">Nobody copies</text><text x="672.0" y="200" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">A hand-written API request</text><text x="672.0" y="216" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Scheduled jobs: each side's own</text><text x="672.0" y="232" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">The schedules themselves</text><text x="672.0" y="248" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">A later-started alarm's dismissal</text><rect x="30" y="358" width="374" height="84" rx="7" fill="#eef0f4" stroke="#6b7280" stroke-width="1"/><text x="217.0" y="376" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#111827">Per side</text><text x="217.0" y="394" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Schedule, away mode, one-time alarm</text><text x="217.0" y="410" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Paused schedule, warm-up, alarm in progress</text><text x="217.0" y="426" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">In-bed sensors and saved stays</text><rect x="420" y="358" width="374" height="84" rx="7" fill="#eef0f4" stroke="#6b7280" stroke-width="1"/><text x="607.0" y="376" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#111827">Whole bed</text><text x="607.0" y="394" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Linked, flipped, auto-off, in-bed settings</text><text x="607.0" y="410" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">The autopilot's night, what it learned, its rules</text><text x="607.0" y="426" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Priming and the daily reboot</text><rect x="30" y="536" width="244" height="84" rx="7" fill="#eef0f4" stroke="#6b7280" stroke-width="1"/><text x="152.0" y="554" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#111827">Swapped going out</text><text x="152.0" y="572" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">A side's temperature</text><text x="152.0" y="588" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Its on-timer</text><text x="152.0" y="604" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Its alarm</text><rect x="290" y="536" width="244" height="84" rx="7" fill="#eef0f4" stroke="#6b7280" stroke-width="1"/><text x="412.0" y="554" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#111827">Swapped coming back</text><text x="412.0" y="572" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Status: target, level, time left</text><text x="412.0" y="588" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Buttons and taps</text><text x="412.0" y="604" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">In-bed sensors, piezo, water</text><rect x="550" y="536" width="244" height="84" rx="7" fill="#eef0f4" stroke="#6b7280" stroke-width="1"/><text x="672.0" y="554" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#111827">Not swapped</text><text x="672.0" y="572" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Stop alarm, prime, status</text><text x="672.0" y="588" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">(they have no side)</text><text x="672.0" y="604" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Hub light levels (API only)</text><rect x="30" y="714" width="764" height="68" rx="7" fill="#eef0f4" stroke="#6b7280" stroke-width="1"/><text x="412.0" y="732" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#111827">The firmware's own left and right halves</text><text x="412.0" y="750" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Never renamed. Flipping changes which half each of the app's sides drives.</text><text x="412.0" y="766" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#4b5563">Each of the app's sides keeps its schedule, settings and saved stays.</text><text x="30" y="810" text-anchor="start" font-size="11.5" fill="#4b5563">After a flip, what was learned about each half goes with the name, not the half: the in-bed baselines and the empty-bed</text><text x="30" y="828" text-anchor="start" font-size="11.5" fill="#4b5563">piezo level. Press Settings > In-bed detection > Bed is empty now with the bed empty. On a Pod 4, tap counts can misfire once.</text><text x="30" y="846" text-anchor="start" font-size="11.5" fill="#4b5563">The older biometrics service (Pod 3 and 4) reads the firmware's sides directly and does not know about the flip.</text><path d="M412 100 L412 128" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M412 266 L412 322" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M412 444 L412 500" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M412 622 L412 678" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/></svg>
