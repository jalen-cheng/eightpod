<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  body { display: flex; gap: 36px; padding: 12px; width: max-content; font-family: -apple-system, 'SF Pro Text', sans-serif; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .phone { padding: 11px; border-radius: 58px; background: #1b1b1d; box-shadow: 0 0 0 2px #3a3a3f, 0 0 0 3px #0a0a0a; }
  .screen { width: 390px; height: 904px; border-radius: 47px; overflow: hidden; background: #141414; position: relative; }
  .status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; box-sizing: border-box; color: #fff; font-size: 15px; font-weight: 600; }
  .island { position: absolute; top: 10px; left: 50%; width: 112px; height: 30px; margin-left: -56px; border-radius: 16px; background: #000; box-shadow: 0 0 0 1px #161616; }
  .signal { display: flex; gap: 5px; align-items: center; }
  .bars { display: flex; gap: 2px; align-items: flex-end; }
  .bars i { width: 3px; background: #fff; border-radius: 1px; }
  .battery { width: 24px; height: 11px; border: 1px solid #ffffff99; border-radius: 3.5px; padding: 1px; box-sizing: border-box; }
  .battery i { display: block; width: 80%; height: 100%; background: #fff; border-radius: 1.5px; }
  img { display: block; width: 390px; height: 860px; }
  figcaption { color: #8b949e; font-size: 22px; font-weight: 500; }
</style>
<body>
<script>
  const CAPTIONS = {
    temperature: 'Temperature', schedule: 'A night, one tab per day', alarm_options: 'Wake-up options', nights: 'Last night',
    settings: 'Autopilot and alarm settings',
  };
  const params = new URLSearchParams(location.search);
  const names = params.get('shots').split(',');
  // The folder the screenshots were captured into, as a file:// address
  const folder = params.get('folder');
  const withCaptions = params.get('captions') === '1';
  for (const name of names) {
    const figure = document.createElement('figure');
    figure.innerHTML = `<div class="phone"><div class="screen">
      <div class="status"><span>9:41</span><span class="signal"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span><span class="battery"><i></i></span></span></div>
      <div class="island"></div><img src="${folder}/${name}.png"></div></div>` + (withCaptions ? `<figcaption>${CAPTIONS[name]}</figcaption>` : '');
    document.body.append(figure);
  }
</script>
</body>
