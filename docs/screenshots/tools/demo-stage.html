<!doctype html>
<!-- The stage a demo video is recorded on, in the style of a screen recording: the app in a
     window on a backdrop, a cursor that glides, and a camera that zooms in on what is pressed.
     Copy into app/public while recording (it must share the app's address), then remove it. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12;
    font-family: 'Geist Variable', -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; }
  /* The backdrop: soft colour behind the window, as screen-recording tools add */
  #backdrop { position: fixed; inset: 0;
    background:
      radial-gradient(60% 70% at 18% 20%, #3b4cca 0%, transparent 60%),
      radial-gradient(55% 65% at 85% 25%, #c2410c 0%, transparent 62%),
      radial-gradient(70% 70% at 60% 95%, #0f766e 0%, transparent 60%),
      #111827; }
  /* Everything the camera looks at. Zooming scales this around the top-left corner. */
  #camera { position: fixed; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0;
    transition: transform 1100ms cubic-bezier(0.65, 0, 0.35, 1); will-change: transform; }
  #window { position: absolute; left: 80px; top: 44px; width: 1120px; height: 632px; border-radius: 14px; overflow: hidden;
    background: #141414; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10), 0 40px 100px rgba(0, 0, 0, 0.55), 0 8px 24px rgba(0, 0, 0, 0.35); }
  #bar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1b1b1b; border-bottom: 1px solid #2b2b2b; }
  #bar i { width: 11px; height: 11px; border-radius: 50%; background: #3f3f3f; }
  #bar span { margin: 0 auto; transform: translateX(-28px); padding: 4px 80px; border-radius: 7px; background: #262626; color: #9b9b9b; font-size: 12px; }
  iframe { display: block; width: 1120px; height: 596px; border: 0; }
  #cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; z-index: 5; pointer-events: none;
    transform: translate(640px, 420px); transition: transform 520ms cubic-bezier(0.45, 0, 0.2, 1); filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5)); }
  /* The arrow dips as it presses, like a finger on a trackpad */
  #cursor svg { transform-origin: 3px 2px; transition: transform 120ms ease; }
  #cursor.down svg { transform: scale(0.8); }
  #ripple { position: absolute; left: -17px; top: -17px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.85); opacity: 0; }
  #ripple.go { animation: ripple 420ms ease-out; }
  @keyframes ripple { from { opacity: 0.9; transform: scale(0.3); } to { opacity: 0; transform: scale(1.5); } }
  /* A line of words under the window saying what is being shown */
  #caption { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px); padding: 11px 24px; border-radius: 999px;
    background: rgba(12, 13, 16, 0.78); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.12);
    color: #f2f2f2; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap; opacity: 0;
    transition: opacity 260ms ease, transform 260ms ease; z-index: 15; }
  #caption.show { opacity: 1; transform: translate(-50%, 0); }
  #card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(8, 9, 12, 0.72); backdrop-filter: blur(18px); color: #f2f2f2; opacity: 0; transition: opacity 600ms ease; z-index: 20; }
  #card.show { opacity: 1; }
  #card img { width: 72px; height: 72px; border-radius: 18px; }
  #card h1 { margin: 6px 0 0; font-size: 54px; letter-spacing: -0.03em; font-weight: 600; }
  #card p { margin: 0; font-size: 24px; color: #b5b5b5; }
  #card b { margin-top: 10px; padding: 10px 22px; border-radius: 999px; background: rgba(255, 255, 255, 0.10); font-size: 21px; font-weight: 500; }
</style>
<body>
  <div id="backdrop"></div>
  <div id="camera">
    <div id="window">
      <div id="bar"><i></i><i></i><i></i><span>eightpod.local</span></div>
      <iframe id="app" src="/"></iframe>
    </div>
    <div id="cursor">
      <div id="ripple"></div>
      <svg viewBox="0 0 22 22" width="22" height="22"><path d="M3 2l6.2 16.2 2.3-6.7 6.7-2.3z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </div>
  </div>
  <div id="card">
    <img src="/eightpod-icon.svg" alt="">
    <h1>EightPod</h1>
    <p>Local control for Eight Sleep Pods. No cloud, no subscription.</p>
  </div>
  <div id="caption"></div>
<script>
  const STAGE = { width: 1280, height: 720 };
  const appFrame = document.getElementById('app');
  const camera = document.getElementById('camera');
  const cursor = document.getElementById('cursor');
  const ripple = document.getElementById('ripple');
  const wait = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));
  window.appDocument = () => appFrame.contentDocument;

  // The first element in the app matching the selector, optionally with this exact text
  window.findInApp = (selector, text) => [...appDocument().querySelectorAll(selector)]
    .find(element => text === undefined || element.textContent.trim() === text);

  // Where an element of the app sits on the stage, before any zoom
  const stagePoint = (element) => {
    const windowBox = document.getElementById('window');
    const box = element.getBoundingClientRect();
    return {
      x: windowBox.offsetLeft + appFrame.offsetLeft + box.left + box.width / 2,
      y: windowBox.offsetTop + appFrame.offsetTop + box.top + box.height / 2,
    };
  };

  // Points the camera at an element with the given zoom, keeping the stage's edges out of shot
  window.zoomTo = (element, zoom = 1.7) => {
    if (!element) return false;
    const point = stagePoint(element);
    const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
    const left = clamp(STAGE.width / 2 - point.x * zoom, STAGE.width - STAGE.width * zoom, 0);
    const top = clamp(STAGE.height / 2 - point.y * zoom, STAGE.height - STAGE.height * zoom, 0);
    camera.style.transform = `translate(${left}px, ${top}px) scale(${zoom})`;
    return true;
  };
  window.zoomOut = () => { camera.style.transform = 'translate(0px, 0px) scale(1)'; return true; };

  // Glides the cursor to an element
  window.moveTo = async (element) => {
    if (!element) return false;
    const point = stagePoint(element);
    cursor.style.transform = `translate(${point.x}px, ${point.y}px)`;
    await wait(540);
    return true;
  };

  // Glides to an element and presses it, with a ring to show the press
  window.press = async (element, pressWith = 'click') => {
    if (!(await moveTo(element))) return false;
    ripple.classList.remove('go');
    void ripple.offsetWidth;
    ripple.classList.add('go');
    cursor.classList.add('down');
    await wait(110);
    setTimeout(() => cursor.classList.remove('down'), 130);
    if (pressWith === 'mousedown') element.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, button: 0 }));
    else element.click();
    return true;
  };

  // Scrolls the app smoothly so an element sits `offset` pixels below the top
  window.scrollAppTo = (element, offset = 90) => {
    if (!element) return false;
    const top = element.getBoundingClientRect().top + appFrame.contentWindow.scrollY - offset;
    appFrame.contentWindow.scrollTo({ top, behavior: 'smooth' });
    return true;
  };

  // Swaps the words under the window; an empty text hides them
  window.caption = async (text) => {
    const line = document.getElementById('caption');
    line.classList.remove('show');
    if (!text) return true;
    await wait(200);
    line.textContent = text;
    line.classList.add('show');
    return true;
  };

  window.showCard = () => { document.getElementById('caption').classList.remove('show'); document.getElementById('card').classList.add('show'); return true; };
</script>
</body>
